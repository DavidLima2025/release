# Mantém o banco do Supabase (plano gratuito) ativo: ele pausa após ~7 dias sem uso.
# A cada 3 dias faz uma consulta leve (confere um link inexistente; não lê nem grava dados).
# A chave usada é a publicável — a mesma que já vai no site, feita para ser pública.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 12 */3 * *"   # 09:17 de Brasília, a cada 3 dias
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://qbfnipyspntxnkvtddzm.supabase.co
      SUPABASE_KEY: sb_publishable_d44kahs-8vhEm9KZ2BfNdQ_NXbGAz1M
    steps:
      - name: Consulta ao banco
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o resposta.json -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/intake_link_info" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{"p_token":"manter-ativo"}')
            echo "HTTP $code: $(cat resposta.json)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::O banco não respondeu. Se estiver pausado, reative em supabase.com/dashboard."
          exit 1
